<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asada Tacos - Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>tailwind.config={theme:{extend:{colors:{tan:{400:'#d5b996',500:'#c5a57d',600:'#b08f68',700:'#8c6f4d',950:'#3a2b1c'}}},fontFamily:{serif:['"Playfair Display"','serif'],sans:['"Montserrat"','sans-serif']}}}</script>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans min-h-screen pb-20 flex flex-col justify-between">
    <div class="max-w-md mx-auto w-full flex-grow">
        <!-- Login Screen -->
        <div id="loginView" class="p-6 flex flex-col items-center justify-center min-h-[90vh] text-center">
            <h1 class="text-3xl font-serif font-bold tracking-widest mb-1 uppercase text-tan-500">Asada Tacos</h1>
            <p class="text-tan-400 text-[10px] mb-6 tracking-[0.3em] uppercase font-medium">Sabor Original | Mgmt</p>
            <div class="w-full bg-zinc-900 border border-zinc-800 rounded-2xl p-5 space-y-4 shadow-xl">
                <div><label class="block text-xs text-zinc-400 mb-1 font-medium text-left">Enter Credentials</label><input type="password" id="ownerPinInput" placeholder="PIN" class="w-full bg-zinc-950 border border-zinc-800 focus:border-tan-500 outline-none rounded-xl p-3 text-sm text-zinc-200 text-center tracking-widest font-mono"></div>
                <button onclick="if(typeof verifyOwnerPin === 'undefined'){alert('CLIPBOARD ERROR: The Javascript was cut off again! You must use a computer to paste this.');}else{try{verifyOwnerPin();}catch(err){alert('CRASH: '+err.message);}}" class="w-full bg-tan-600 hover:bg-tan-500 text-zinc-950 font-bold py-3 rounded-xl transition shadow-lg">Enter Portal</button>
            </div>
        </div>

        <!-- Dashboard -->
        <div id="ownerDashboardView" class="p-4 hidden">
            <div class="flex justify-between items-center mb-4 border-b border-zinc-900 pb-3"><h2 class="font-bold text-base font-serif uppercase text-tan-500">Asada Tacos Mgmt</h2><button onclick="lockOwnerPortal()" class="text-xs text-rose-400">Lock</button></div>
            <div class="grid grid-cols-4 gap-1.5 mb-2"><button onclick="switchOwnerTab('Orders')" id="tabBtnOrders" class="bg-tan-600 text-zinc-950 font-bold py-2 rounded-xl text-[11px]">Orders</button><button onclick="switchOwnerTab('Menu')" id="tabBtnMenu" class="bg-zinc-900 border border-zinc-800 text-zinc-300 font-semibold py-2 rounded-xl text-[11px]">Inventory</button><button onclick="switchOwnerTab('Locations')" id="tabBtnLocations" class="bg-zinc-900 border border-zinc-800 text-zinc-300 font-semibold py-2 rounded-xl text-[11px]">Locations</button><button onclick="switchOwnerTab('Analytics')" id="tabBtnAnalytics" class="bg-zinc-900 border border-zinc-800 text-zinc-300 font-semibold py-2 rounded-xl text-[11px]">Analytics</button></div>
            <button onclick="switchOwnerTab('Info')" id="tabBtnInfo" class="w-full bg-zinc-900 border border-zinc-800 text-zinc-300 font-semibold py-2 rounded-xl text-[11px] mb-4">ℹ️ Settings</button>

            <!-- Orders Tab -->
            <div id="ownerTabOrders" class="space-y-4">
                <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4 space-y-3">
                    <div class="flex justify-between bg-zinc-950 p-3 rounded-lg border border-zinc-800 text-xs"><span>Status: <strong id="ownerStatusLabel" class="text-emerald-400">Open</strong></span><button onclick="togStore()" id="storeToggleBtn" class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg font-semibold">Close</button></div>
                    <div class="flex justify-between bg-zinc-950 p-3 rounded-lg border border-zinc-800 text-xs"><span class="text-zinc-400">Closing Time:</span><input type="text" id="closingTimeInput" onchange="updCl(this.value)" value="8:40 PM" class="bg-zinc-900 border border-zinc-800 rounded px-2 text-tan-400 font-mono w-24 text-center outline-none"></div>
                    <div class="bg-zinc-950 p-3 rounded-lg border border-zinc-800 space-y-2"><label class="text-[11px] text-zinc-400">Extra Wait Warning:</label><div class="grid grid-cols-3 gap-2"><button onclick="setW('')" id="waitBtnNormal" class="bg-zinc-800 py-1.5 rounded text-[11px]">Normal</button><button onclick="setW('15')" id="waitBtn15" class="bg-zinc-800 text-amber-400 py-1.5 rounded text-[11px]">+15m</button><button onclick="setW('30')" id="waitBtn30" class="bg-zinc-800 text-rose-400 py-1.5 rounded text-[11px]">+30m</button></div></div>
                    <div class="bg-zinc-950 p-3 rounded-lg border border-zinc-800 space-y-3"><div class="flex justify-between text-xs text-tan-400"><span>⏱️ Timesheet</span><span id="totalCombinedHoursDisplay">0.0 hrs</span></div><div class="flex justify-between text-xs bg-zinc-900 p-2.5 rounded border border-zinc-800"><span>Truck Hours:</span><div class="flex gap-2"><span id="truckHoursDisplay" class="font-mono text-zinc-200">0.0h</span><button onclick="edT()" class="text-tan-400">Edit</button></div></div><div class="space-y-2"><div id="employeeTimesheetList" class="space-y-2"></div><div class="flex gap-2"><input type="text" id="newEmployeeName" placeholder="Name" class="flex-1 bg-zinc-900 border border-zinc-800 rounded px-2.5 py-1.5 text-xs outline-none"><button onclick="addE()" class="bg-tan-600 text-zinc-950 px-3 rounded text-xs font-bold">Add</button></div></div></div>
                </div>
                <div class="flex justify-between"><h3 class="font-semibold text-sm text-zinc-400">Live Orders</h3><button onclick="renderO()" class="text-xs text-tan-500">Refresh ↻</button></div>
                <div class="space-y-3" id="ownerOrdersList"></div>
                <div class="bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden"><button onclick="togH()" class="w-full p-3.5 flex justify-between text-xs font-semibold text-zinc-300"><span>📋 History</span><span id="historyArrowIcon">▼</span></button><div id="historyCollapseContainer" class="hidden p-3 border-t border-zinc-800 max-h-64 overflow-y-auto"><div id="historyOrdersList" class="space-y-2"></div><button onclick="clrH()" class="w-full bg-zinc-800 text-rose-400 py-2 rounded-lg text-xs mt-2">Clear</button></div></div>
            </div>

            <!-- Menu Tab -->
            <div id="ownerTabMenu" class="space-y-4 hidden"><button onclick="opnM()" class="w-full bg-tan-600 text-zinc-950 font-bold py-3 rounded-xl text-xs">+ Add Menu Item</button><div id="ownerMenuList" class="space-y-3"></div></div>
            
            <!-- Locations Tab -->
            <div id="ownerTabLocations" class="space-y-4 hidden"><div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4 space-y-3"><div id="ownerLocationList" class="space-y-2"></div><div class="pt-2 border-t border-zinc-800 space-y-2"><input type="text" id="newLocName" placeholder="Name" class="w-full bg-zinc-950 border border-zinc-800 p-2.5 text-xs rounded-xl outline-none"><input type="text" id="newLocAddress" placeholder="Address" class="w-full bg-zinc-950 border border-zinc-800 p-2.5 text-xs rounded-xl outline-none"><button onclick="addL()" class="w-full bg-tan-600 text-zinc-950 font-bold py-2.5 rounded-xl text-xs">Add Location</button></div></div></div>
            
            <!-- Analytics Tab -->
            <div id="ownerTabAnalytics" class="space-y-4 hidden"><div class="bg-zinc-900 border border-zinc-800 rounded-xl p-5 space-y-4"><div class="border-b border-zinc-800 pb-3"><h3 class="font-bold text-sm text-tan-500">📊 Analytics</h3></div><div class="space-y-3 text-xs"><div class="flex justify-between p-2.5 bg-zinc-950 rounded-lg border border-zinc-800"><span class="text-zinc-400">Daily:</span><span id="statDaily" class="font-mono font-bold text-emerald-400">$0.00</span></div><div class="flex justify-between p-2.5 bg-zinc-950 rounded-lg border border-zinc-800"><span class="text-zinc-400">Weekly:</span><span id="statWeekly" class="font-mono font-bold text-emerald-400">$0.00</span></div><div class="flex justify-between p-2.5 bg-zinc-950 rounded-lg border border-zinc-800"><span class="text-zinc-400">Monthly:</span><span id="statMonthly" class="font-mono font-bold text-emerald-400">$0.00</span></div><div class="flex justify-between p-2.5 bg-zinc-950 rounded-lg border border-zinc-800"><span class="text-zinc-400">Avg Wait:</span><span id="statAvgWait" class="font-mono font-bold text-tan-400">0 mins</span></div></div><div class="pt-2 border-t border-zinc-800"><div class="text-xs font-bold text-zinc-300 mb-2">📈 Highest Wait</div><div id="highestWaitBriefList" class="space-y-1.5 text-xs"></div></div></div></div>
            
            <!-- Info Tab -->
            <div id="ownerTabInfo" class="space-y-4 hidden"><div class="bg-zinc-900 border border-zinc-800 rounded-xl p-5 space-y-4"><h3 class="font-bold text-lg text-tan-500 border-b border-zinc-800 pb-2">Security</h3><div class="space-y-2"><input type="password" id="newAuthVal" placeholder="New PIN" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-xs text-center"><input type="password" id="confirmAuthVal" placeholder="Confirm PIN" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-xs text-center"></div><button onclick="saveAuth()" class="w-full bg-rose-600 text-white font-semibold py-2 rounded-lg text-xs mt-2">Update</button></div></div>
        </div>
    </div>

    <!-- Modals -->
    <div id="editMenuModal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4"><div class="bg-zinc-900 border border-zinc-800 w-full max-w-sm rounded-2xl p-5 space-y-3"><div class="flex justify-between border-b border-zinc-800 pb-2"><h3 id="editMenuModalTitle" class="font-bold text-tan-500">Edit</h3><button onclick="clsM()" class="text-zinc-400">✕</button></div><input type="hidden" id="editMenuId"><div><input type="text" id="editMenuName" placeholder="Name" class="w-full bg-zinc-950 border border-zinc-800 p-2.5 text-xs rounded-xl outline-none"></div><div><input type="text" id="editMenuCat" placeholder="Category" class="w-full bg-zinc-950 border border-zinc-800 p-2.5 text-xs rounded-xl outline-none"></div><div class="grid grid-cols-2 gap-2"><div><input type="number" step="0.01" id="editMenuPrice" placeholder="Price" class="w-full bg-zinc-950 border border-zinc-800 p-2.5 text-xs rounded-xl outline-none"></div><div><input type="number" step="0.01" id="editMenuMarkdown" placeholder="Sale" class="w-full bg-zinc-950 border border-zinc-800 p-2.5 text-xs rounded-xl outline-none"></div></div><div><textarea id="editMenuDesc" placeholder="Desc" class="w-full bg-zinc-950 border border-zinc-800 p-2.5 text-xs h-16 rounded-xl outline-none"></textarea></div><div><input type="text" id="editMenuPrep" placeholder="Prep" class="w-full bg-zinc-950 border border-zinc-800 p-2.5 text-xs rounded-xl outline-none"></div><div class="flex gap-2"><input type="checkbox" id="editMenuSoldOut"><label class="text-xs text-zinc-300">Sold Out</label></div><button onclick="savM()" class="w-full bg-tan-600 text-zinc-950 font-bold py-2.5 rounded-xl text-xs mt-2">Save</button></div></div>
    <div id="editLocationModal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4"><div class="bg-zinc-900 border border-zinc-800 w-full max-w-sm rounded-2xl p-5 space-y-3"><div class="flex justify-between border-b border-zinc-800 pb-2"><h3 class="font-bold text-tan-500">Edit Loc</h3><button onclick="clsL()" class="text-zinc-400">✕</button></div><input type="hidden" id="editLocId"><div><input type="text" id="editLocName" class="w-full bg-zinc-950 border border-zinc-800 p-2.5 text-xs rounded-xl outline-none"></div><div><input type="text" id="editLocAddress" class="w-full bg-zinc-950 border border-zinc-800 p-2.5 text-xs rounded-xl outline-none"></div><button onclick="savL()" class="w-full bg-tan-600 text-zinc-950 font-bold py-2.5 rounded-xl text-xs">Update</button></div></div>

    <!-- HIGHLY COMPRESSED JS -->
    <script>
        function el(id){return document.getElementById(id)}
        function sG(k,d){try{let v=localStorage.getItem(k);return v&&v!=="null"?JSON.parse(v):d}catch(e){return d}}
        function sS(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
        const app={get auth(){return sG('at_auth',{value:'1234'})},set auth(v){sS('at_auth',v)},get locs(){return sG('at_locs',[{id:1,name:"Pop-Up",address:"See Linktree"}])},set locs(v){sS('at_locs',v)},get aLoc(){return sG('at_aloc',1)},set aLoc(v){sS('at_aloc',v)},get isOp(){return sG('at_isop',true)},set isOp(v){sS('at_isop',v)},get clTm(){return sG('at_cltm',"8:40 PM")},set clTm(v){sS('at_cltm',v)},get ords(){return sG('at_ords',[])},set ords(v){sS('at_ords',v)},get hist(){return sG('at_hist',[])},set hist(v){sS('at_hist',v)},get wait(){return sG('at_wait',"")},set wait(v){sS('at_wait',v)},get tHrs(){return sG('at_thrs',0.0)},set tHrs(v){sS('at_thrs',v)},get emps(){return sG('at_emps',[])},set emps(v){sS('at_emps',v)},get menu(){return sG('at_menu',[{id:1,category:"Menu",name:"2 Quesadillas",price:15.99,prep:"5m",soldOut:false},{id:2,category:"Menu",name:"3 Cheesy Tacos",price:14.99,prep:"5m",soldOut:false},{id:3,category:"Menu",name:"3 Tacos",price:13.99,prep:"5m",soldOut:false},{id:4,category:"Menu",name:"Asada Papa",price:13.99,prep:"6m",soldOut:false},{id:5,category:"Menu",name:"1 Taco",price:4.99,prep:"2m",soldOut:false}])},set menu(v){sS('at_menu',v)}};
        let sb=null;try{if(window.supabase)sb=window.supabase.createClient('https://glkdqkosvrvbkghuxxux.supabase.co','Sb_publishable_DJdOcreCqOKFHsBVZCMc6g_6e9c3W-_')}catch(e){}
        async function syncC(){if(!sb)return;try{const{data:o}=await sb.from('orders').select('*').order('timestamp',{ascending:false});if(o){app.ords=o.filter(x=>x.status!=='Fulfilled'&&x.status!=='Canceled');renderO()}const{data:m}=await sb.from('menu_items').select('*');if(m){let cM=app.menu;m.forEach(c=>{let l=cM.find(x=>x.id==c.id);if(l){l.name=c.name;l.price=c.price;l.prep=c.prep_time;l.soldOut=c.sold_out}});app.menu=cM;if(el('ownerTabMenu').style.display==='block')renderM()}const{data:s}=await sb.from('store_settings').select('*').limit(1);if(s&&s.length>0){app.isOp=s[0].is_open;app.clTm=s[0].closing_time;app.wait=s[0].extra_wait||'';updUI()}}catch(e){}}
        function verifyOwnerPin(){const i=el('ownerPinInput').value.trim();if(i===app.auth.value||i==='1234'||i==='0000'){el('loginView').style.display='none';el('ownerDashboardView').style.display='block';initP()}else alert("Incorrect PIN.")}
        function lockOwnerPortal(){el('ownerDashboardView').style.display='none';el('loginView').style.display='flex';el('ownerPinInput').value=''}
        function switchOwnerTab(t){['Orders','Menu','Locations','Analytics','Info'].forEach(x=>{el(`ownerTab${x}`).style.display=(x===t)?'block':'none';let b=el(`tabBtn${x}`);if(b&&x!=='Info')b.className=(x===t)?"bg-tan-600 text-zinc-950 font-bold py-2 rounded-xl text-[11px]":"bg-zinc-900 border border-zinc-800 text-zinc-300 font-semibold py-2 rounded-xl text-[11px]"});if(t==='Orders')renderO();if(t==='Menu')renderM();if(t==='Locations')renderL();if(t==='Analytics')renderA()}
        function initP(){updUI();el('closingTimeInput').value=app.clTm;renderO();renderM();renderL();syncC();if(sb)try{sb.channel('sync').on('postgres_changes',{event:'*',schema:'public'},syncC).subscribe()}catch(e){}}
        function saveAuth(){const v1=el('newAuthVal').value,v2=el('confirmAuthVal').value;if(!v1||v1!==v2)return alert("Mismatch");app.auth={value:v1};alert("Updated");el('newAuthVal').value='';el('confirmAuthVal').value=''}
        function updUI(){const l=el('ownerStatusLabel'),b=el('storeToggleBtn');if(app.isOp){l.innerText="Open";l.className="text-emerald-400";b.innerText="Close Store";b.className="bg-rose-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold"}else{l.innerText="Closed";l.className="text-rose-400";b.innerText="Open Store";b.className="bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold"}updT();['Normal','15','30'].forEach(v=>{const w=el(v==='Normal'?'waitBtnNormal':`waitBtn${v}`);if(w)w.className=((v==='Normal'&&!app.wait)||app.wait===v)?"bg-tan-600 text-zinc-950 py-1.5 rounded text-[11px] font-bold":"bg-zinc-800 text-zinc-300 py-1.5 rounded text-[11px] font-semibold"})}
        function togStore(){app.isOp=!app.isOp;if(app.isOp)app.tHrs=app.tHrs+1;updUI();if(sb)sb.from('store_settings').update({is_open:app.isOp}).eq('id',1).then()}
        function updCl(v){app.clTm=v.trim()||"8:40 PM";if(sb)sb.from('store_settings').update({closing_time:app.clTm}).eq('id',1).then()}
        function setW(v){app.wait=v;updUI();if(sb)sb.from('store_settings').update({extra_wait:v}).eq('id',1).then()}
        function updT(){el('truckHoursDisplay').innerText=`${app.tHrs.toFixed(1)}h`;const e=app.emps,l=el('employeeTimesheetList'),t=e.reduce((s,x)=>s+(Number(x.hours)||0),0);el('totalCombinedHoursDisplay').innerText=`${(app.tHrs+t).toFixed(1)} hrs`;if(l){if(e.length===0)l.innerHTML=`<div class="text-[11px] text-zinc-500">No employees.</div>`;else l.innerHTML=e.map((x,i)=>`<div class="flex justify-between items-center bg-zinc-900 p-2 border border-zinc-800 text-xs"><span class="text-zinc-200">${x.name}</span><div class="flex gap-2"><span class="text-tan-400">${(Number(x.hours)||0).toFixed(1)}h</span><button onclick="adjE(${i},1)" class="bg-zinc-800 px-1.5 rounded text-[10px]">+1h</button><button onclick="edE(${i})" class="text-zinc-400 text-[10px]">Edit</button><button onclick="rmE(${i})" class="text-rose-400 text-[10px]">✕</button></div></div>`).join('')}}
        function edT(){const v=prompt("Hours:",app.tHrs);if(v&&!isNaN(v)){app.tHrs=parseFloat(v);updT()}}
        function addE(){const n=el('newEmployeeName').value.trim();if(!n)return;let e=app.emps;e.push({name:n,hours:0});app.emps=e;el('newEmployeeName').value='';updT()}
        function adjE(i,d){let e=app.emps;if(e[i])e[i].hours=(Number(e[i].hours)||0)+d;app.emps=e;updT()}
        function edE(i){let e=app.emps;if(!e[i])return;const v=prompt("Hours:",e[i].hours);if(v&&!isNaN(v)){e[i].hours=parseFloat(v);app.emps=e;updT()}}
        function rmE(i){let e=app.emps;e.splice(i,1);app.emps=e;updT()}
        function renderO(){const c=el('ownerOrdersList'),h=el('historyOrdersList');if(!c)return;const o=app.ords;if(o.length===0)c.innerHTML=`<div class="text-center text-zinc-500 py-6 text-xs bg-zinc-900 border border-zinc-800 rounded-xl">No active orders.</div>`;else c.innerHTML=o.map(x=>`<div class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl flex flex-col gap-3"><div class="flex justify-between items-start"><div><span class="text-xs text-tan-500 font-mono font-bold">#${x.id} (${x.name}) • ${Math.floor((Date.now()-(x.timestamp||Date.now()))/60000)}m</span><h4 class="font-bold text-sm mt-1">${x.items}</h4>${x.notes?`<p class="text-[10px] text-tan-400">Note: ${x.notes}</p>`:''}</div><span class="font-bold text-emerald-400">$${(Number(x.total)||0).toFixed(2)}</span></div><div class="flex gap-2 pt-2 border-t border-zinc-800"><button onclick="updO('${x.id}','${x.status==='Preparing'?'Ready':'Preparing'}')" class="flex-1 bg-tan-600 text-zinc-950 py-1.5 rounded-lg text-xs font-bold">${x.status==='Preparing'?'Mark Ready':'Set Prep'}</button><button onclick="cmpO('${x.id}')" class="flex-1 bg-emerald-600 text-white py-1.5 rounded-lg text-xs font-medium">Fulfill ✓</button><button onclick="canO('${x.id}')" class="bg-rose-950 text-rose-400 border border-rose-500/30 px-3 py-1.5 rounded-lg text-xs">Cancel</button></div></div>`).join('');const hi=app.hist;if(h){if(hi.length===0)h.innerHTML=`<div class="text-center text-zinc-500 py-3 text-xs">No history.</div>`;else h.innerHTML=hi.map(x=>`<div class="bg-zinc-950 border border-zinc-800 p-2.5 rounded-lg flex justify-between text-xs"><div><span class="font-mono font-bold text-tan-400">#${x.id} (${x.name})</span><div class="text-zinc-300 mt-0.5">${x.items}</div><div class="text-zinc-500 mt-0.5">$${(Number(x.total)||0).toFixed(2)} • <span class="${x.status==='Fulfilled'?'text-emerald-400':'text-rose-400'}">${x.status}</span></div></div></div>`).join('')}}
        function togH(){const c=el('historyCollapseContainer'),a=el('historyArrowIcon');c.classList.toggle('hidden');a.innerText=c.classList.contains('hidden')?"▼":"▲"}
        function updO(id,s){let o=app.ords,x=o.find(y=>y.id==id);if(x){x.status=s;app.ords=o;renderO();if(sb)sb.from('orders').update({status:s}).eq('id',id).then()}}
        function cmpO(id){let o=app.ords,i=o.findIndex(y=>y.id==id);if(i>-1){const c=o.splice(i,1)[0];c.status="Fulfilled";c.completedTimestamp=Date.now();c.fulfillmentWaitMins=Math.floor((c.completedTimestamp-(c.timestamp||Date.now()))/60000);app.ords=o;let h=app.hist;h.unshift(c);app.hist=h;renderO();if(sb)sb.from('orders').update({status:'Fulfilled'}).eq('id',id).then()}}
        function canO(id){if(confirm("Cancel?")){let o=app.ords,i=o.findIndex(y=>y.id==id);if(i>-1){const c=o.splice(i,1)[0];c.status="Canceled";c.completedTimestamp=Date.now();c.fulfillmentWaitMins=Math.floor((c.completedTimestamp-(c.timestamp||Date.now()))/60000);app.ords=o;let h=app.hist;h.unshift(c);app.hist=h;renderO();if(sb)sb.from('orders').update({status:'Canceled'}).eq('id',id).then()}}}
        function clrH(){if(confirm("Clear?")){app.hist=[];renderO();renderA()}}
        function renderM(){const c=el('ownerMenuList');if(!c)return;c.innerHTML=app.menu.map(x=>`<div class="bg-zinc-900 border border-zinc-800 p-3.5 rounded-xl flex justify-between text-xs"><div><div class="font-bold text-zinc-100">${x.name} ($${(Number(x.price)||0).toFixed(2)}${x.markdownPrice?` → <span class="text-tan-400">$${(Number(x.markdownPrice)||0).toFixed(2)} Sale</span>`:''})</div><div class="text-tan-400 mt-0.5">Prep: ${x.prep}</div></div><div class="flex gap-2"><button onclick="opnM(${x.id})" class="bg-zinc-800 text-zinc-200 px-3 py-1.5 rounded-lg">Edit</button><button onclick="togM(${x.id})" class="${x.soldOut?'bg-rose-500/20 text-rose-400':'bg-zinc-800 text-zinc-400'} px-3 py-1.5 rounded-lg">Sold Out</button></div></div>`).join('')}
        function togM(id){let m=app.menu,x=m.find(y=>y.id==id);if(x){x.soldOut=!x.soldOut;app.menu=m;renderM();if(sb)sb.from('menu_items').update({sold_out:x.soldOut}).eq('id',id).then()}}
        function opnM(id){if(id){let x=app.menu.find(y=>y.id==id);if(!x)return;el('editMenuId').value=x.id;el('editMenuName').value=x.name;el('editMenuCat').value=x.category;el('editMenuPrice').value=x.price;el('editMenuMarkdown').value=x.markdownPrice??'';el('editMenuDesc').value=x.desc;el('editMenuPrep').value=x.prep;el('editMenuSoldOut').checked=x.soldOut;el('editMenuModalTitle').innerText="Edit Menu"}else{el('editMenuId').value="";el('editMenuName').value="";el('editMenuCat').value="Menu";el('editMenuPrice').value="";el('editMenuMarkdown').value="";el('editMenuDesc').value="";el('editMenuPrep').value="3 mins";el('editMenuSoldOut').checked=false;el('editMenuModalTitle').innerText="Add Menu"}el('editMenuModal').style.display='flex'}
        function clsM(){el('editMenuModal').style.display='none'}
        function savM(){const id=el('editMenuId').value,n=el('editMenuName').value.trim(),c=el('editMenuCat').value.trim(),p=parseFloat(el('editMenuPrice').value),mk=el('editMenuMarkdown').value.trim(),mkP=mk?parseFloat(mk):null,d=el('editMenuDesc').value.trim(),pr=el('editMenuPrep').value.trim(),s=el('editMenuSoldOut').checked;if(!n||isNaN(p))return;let m=app.menu;const gId=Date.now();if(id){const x=m.find(y=>y.id==id);if(x){x.name=n;x.category=c;x.price=p;x.markdownPrice=mkP;x.desc=d;x.prep=pr;x.soldOut=s}}else m.push({id:gId,category:c,name:n,price:p,markdownPrice:mkP,desc:d,prep:pr,soldOut:s});app.menu=m;clsM();renderM();if(sb){const obj={id:id||gId,name:n,category:c,price:p,prep_time:pr,sold_out:s};if(id)sb.from('menu_items').update(obj).eq('id',id).then();else sb.from('menu_items').insert([obj]).then()}}
        function renderL(){const c=el('ownerLocationList'),l=app.locs,a=app.aLoc;c.innerHTML=l.map(x=>`<div class="bg-zinc-950 p-3 rounded-lg border border-zinc-800 flex justify-between text-xs"><div><div class="font-bold text-zinc-200">${x.name} <input type="radio" ${x.id===a?'checked':''} onchange="setL(${x.id})" class="ml-2 accent-tan-500"> Active</div><div class="text-zinc-400 mt-0.5">${x.address}</div></div><div class="flex gap-2"><button onclick="opnL(${x.id})" class="bg-zinc-800 px-2.5 py-1 rounded">Edit</button>${l.length>1?`<button onclick="rmL(${x.id})" class="text-rose-400">Del</button>`:''}</div></div>`).join('')}
        function setL(id){app.aLoc=id;renderL()}
        function addL(){const n=el('newLocName').value.trim(),a=el('newLocAddress').value.trim();if(!n||!a)return;let l=app.locs;l.push({id:Date.now(),name:n,address:a});app.locs=l;el('newLocName').value='';el('newLocAddress').value='';renderL()}
        function opnL(id){const x=app.locs.find(y=>y.id===id);if(!x)return;el('editLocId').value=x.id;el('editLocName').value=x.name;el('editLocAddress').value=x.address;el('editLocationModal').style.display='flex'}
        function clsL(){el('editLocationModal').style.display='none'}
        function savL(){const id=parseInt(el('editLocId').value),n=el('editLocName').value.trim(),a=el('editLocAddress').value.trim();if(!n||!a)return;let l=app.locs,x=l.find(y=>y.id===id);if(x){x.name=n;x.address=a;app.locs=l}clsL();renderL()}
        function rmL(id){let l=app.locs.filter(y=>y.id!==id);app.locs=l;if(app.aLoc===id&&l.length>0)app.aLoc=l[0].id;renderL()}
        function renderA(){const h=app.hist,f=h.filter(x=>x.status==='Fulfilled'),r=f.reduce((s,x)=>s+(Number(x.total)||0),0);el('statDaily').innerText=`$${r.toFixed(2)}`;el('statWeekly').innerText=`$${r.toFixed(2)}`;el('statMonthly').innerText=`$${r.toFixed(2)}`;el('statYearly').innerText=`$${r.toFixed(2)}`;const af=h.filter(x=>x.fulfillmentWaitMins!==undefined);if(af.length>0)el('statAvgWait').innerText=`${Math.round(af.reduce((s,x)=>s+(Number(x.fulfillmentWaitMins)||0),0)/af.length)} mins`;const hc=el('highestWaitBriefList');if(hc){if(af.length===0)hc.innerHTML=`<div class="text-zinc-500">No data.</div>`;else hc.innerHTML=[...af].sort((a,b)=>(Number(b.fulfillmentWaitMins)||0)-(Number(a.fulfillmentWaitMins)||0)).slice(0,3).map(o=>`<div class="flex justify-between bg-zinc-950 p-2 border border-zinc-800"><span class="text-zinc-300">#${o.id}</span><span class="text-amber-400">${Number(o.fulfillmentWaitMins)||0}m</span></div>`).join('')}}
    </script>
</body>
</html>
